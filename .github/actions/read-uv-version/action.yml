name: Read uv version from Dockerfile
description: >-
  Extracts the pinned uv version from the Dockerfile base layer and exposes it
  as the "version" output. Used by several jobs to feed setup-uv with the exact
  version the image pins, instead of repeating the same grep in each workflow.

outputs:
  version:
    description: The uv version pinned in the Dockerfile (e.g. "0.12.11").
    value: ${{ steps.read.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read uv version
      id: read
      shell: bash
      run: |
        version=$(grep -oP '(?<=^FROM ghcr\.io/astral-sh/uv:)[^@\s]+' Dockerfile)
        if [ -z "$version" ]; then
          echo "::error::could not extract uv version from Dockerfile"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"