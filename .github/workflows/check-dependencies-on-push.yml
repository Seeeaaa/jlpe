name: Check dependency freshness
on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract Python version
        id: pyver
        run: |
          version=$(grep -oP '(?<=^FROM python:)[0-9.]+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Sync environment
        run: uv sync --all-groups --python ${{ steps.pyver.outputs.version }}

      - name: Check outdated packages
        run: |
          outdated=$(uv pip list --outdated)
          if [ -n "$outdated" ]; then
            echo "$outdated"
            echo "::warning::Found outdated packages, see job log"
          else
            echo "All packages up to date"
          fi