name: Reconcile code-scanning alerts

# Keeps the Security tab in sync with the current published image. The daily
# scan uploads the findings as a SARIF analysis on refs/heads/main under the
# fixed category below, and GitHub's native code-scanning state management
# does the rest: an alert whose finding is still present in the latest
# analysis stays open, a finding that disappeared closes automatically as
# "fixed", and a new finding opens a new alert - all without a manual
# dismissal pass.
#
# History: before 2026-10 this workflow dismissed stale open alerts by hand,
# matching each alert's (CVE, package, installed version) tuple against the
# current scan. That closure loop is removed here: once uploads replace the
# same analysis natively, the loop is redundant - and actively harmful,
# because it dismisses alerts that the next upload re-opens.
#
# The category deliberately continues the pre-#193 analysis key
# (.github/workflows/build.yml:build - the auto-derived value the old
# upload-sarif step used before #193 removed it). Reusing it means the first
# upload after this change REPLACES that last analysis instead of creating a
# second, parallel alert set: the alerts open at cutover roll over natively
# (kept open while their finding is still present, closed as "fixed" when
# the fingerprint changed), instead of leaving a permanent duplicate set
# behind. Analyses are keyed by (ref, category), so a fresh category here
# would strand the existing alerts open forever - they are never replaced
# by, nor deduplicated against, a different category.
#
# Fixed ref + fixed category are the two parameters that make the native
# dedupe work: per-ref uploads (the image digest, in #193's case) were what
# created the never-closing alert ledger that motivated removing SARIF in
# the first place. The scan itself stays a single daily scan - only its
# output format changed.
#
# Runs on every main push (new image is live) and daily to also catch fixes
# published between builds. PR runs (paths-triggered test runs of this
# file) never touch the tab: the upload step is gated off for pull_request.

on:
  push:
    branches: [main]
  schedule:
    # After the daily stamp-date build publishes, reconcile alerts.
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  # security-events: write is required by upload-sarif; contents read is
  # implicit. This permission predates this change - it was kept on this
  # workflow through #193 and is now used by the upload again.
  contents: read
  security-events: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  reconcile-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve published image digest (resolve 'latest')
        id: imgref
        run: |
          digest=$(docker manifest inspect vyxan/jlpe_image:latest -v | jq -r '.Descriptor.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=vyxan/jlpe_image@$digest" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of current published image (SARIF)
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.imgref.outputs.image }}
          severity: CRITICAL,HIGH
          format: sarif
          output: current-scan.sarif
          # Load-bearing: under format: sarif the action's entrypoint unsets
          # TRIVY_SEVERITY unless this flag is set (v0.36.0 entrypoint.sh:
          # "Building SARIF report with all severities"), so without it the
          # severity input above is silently ignored and the upload carries
          # every LOW/MEDIUM/UNKNOWN finding into the Security tab. Verified
          # against the 2026-10-03 analysis: 249 results where only 55 were
          # HIGH (0 CRITICAL) - the rest LOW 102 / MEDIUM 87 / UNKNOWN 5.
          limit-severities-for-sarif: 'true'

      - name: Refuse to upload an empty scan
        # A zero-result scan means a trivy/DB outage, not a clean image (the
        # image carries ~55 high/critical findings at the time of writing).
        # Uploading it would close every open alert as "fixed" - the SARIF
        # equivalent of the wipe-out the old tuple loop's empty-file guard
        # protected against. Fail the run instead: the previous analysis
        # stays in place and the daily schedule retries tomorrow. A
        # malformed SARIF fails the jq call itself under errexit, which also
        # blocks the upload.
        run: |
          results_count=$(jq '.runs[0].results | length' current-scan.sarif)
          if [ "$results_count" -eq 0 ]; then
            echo "::error::trivy scan yielded 0 results - refusing to upload (an empty DB would close all alerts as fixed)"
            exit 1
          fi
          echo "scan has $results_count finding(s); upload OK"

      - name: Upload SARIF to the Security tab
        # Fixed ref + fixed category: every upload replaces the same analysis
        # (refs/heads/main + the category above), which is what GitHub's
        # native dedupe needs - see the header comment for why these two
        # parameters are load-bearing. ref and sha are required as a PAIR
        # when either is provided: with ref alone the action falls back to
        # the checkout path for the sha (seen in practice as "Both 'ref' and
        # 'sha' are required if one of them is provided" - this workflow has
        # no checkout step, so the fallback died and the upload failed).
        # github.sha is the sha of THIS workflow run's main checkout, which
        # is the commit the analysis documents; a schedule run checks out
        # main's head, so the sha always lands on a real main commit.
        # PR runs are gated off so a paths-triggered test run never writes
        # to the main analysis (the same reason the old upload-sarif step
        # needed the push-path permission split before #193).
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: current-scan.sarif
          ref: refs/heads/main
          sha: ${{ github.sha }}
          category: .github/workflows/build.yml:build
