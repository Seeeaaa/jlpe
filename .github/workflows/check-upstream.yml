name: Check upstream drift
concurrency:
  # Two runs of this workflow must not overlap: both intermediate-deps and
  # dependency-probes consume and mutate uv.lock, so a manual dispatch landing
  # on top of the nightly cron (or a push) could interleave the two consumers
  # and resolve against a moving lock. Serialize all runs of this workflow;
  # the needs: chain already serializes jobs within a run.
  group: check-upstream
  cancel-in-progress: false

# Consolidated daily checks that used to live in five separate workflows:
#   check-python-version.yml       -> bump-base (matrix component: python)
#   check-uv-version.yml           -> bump-base (matrix component: uv)
#   check-intermediate-deps.yml    -> intermediate-deps
#   check-dependency-probes.yml    -> dependency-probes + probe
#   check-dependencies-on-push.yml -> (removed; outdated-report dropped later)
#
# Ordering: the old files used staggered cron hours (20/21/22) so an earlier
# check could finish before a later one started. Inside one workflow the
# ordering is explicit via needs:, which is deterministic instead of
# clock-based. bump-base opens PRs but never touches main directly, so
# intermediate-deps and dependency-probes always resolve against main's
# uv.lock regardless of matrix outcomes.
#
# Manual runs: "Run workflow" shows two fields.
#   checks     - csv subset of python,uv,intermediate,probes,python-minor
#                (empty = run everything, like the scheduled nightly run)
#   probe_only - single candidate name for probes; used only when checks
#                includes "probes" (replaces the old per-workflow input)

on:
  schedule:
    - cron: "0 20 * * *" # every day, 20:00 UTC (single slot replaces 20/21/22)
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/check-upstream.yml"
  workflow_dispatch:
    inputs:
      checks:
        description: "Checks to run: csv from python,uv,intermediate,probes,python-minor (empty = all)"
        required: false
        type: string
      probe_only:
        description: "Probes: single candidate name (used only when checks includes probes)"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # Shared extraction of pinned versions from the Dockerfile, via the
  # composite actions (read-python-version / read-uv-version) so no workflow
  # or job repeats the grep logic. Base image freshness: one job with a
  # component matrix replaces the two near-identical check-python-version /
  # check-uv-version workflows.
  # CHECKS is normalized here (empty string means "all"): GitHub delivers an
  # empty dispatch input as null, and contains(null, x) evaluates on the
  # string "null", which broke selection in the first revision - every
  # non-bump job skipped on a full run, and bump-base ran when only probes
  # was selected. The normalize step guarantees a real csv string.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The stamp-date job in build.yml pushes a "[skip build]" commit that
    # touches only the VERSION file, which does NOT match this workflow's
    # push paths filter above (Dockerfile/pyproject.toml/uv.lock), so stamp
    # commits do not re-run the upstream check at all. The author guard
    # below is kept as a second line of defense: if the stamp ever starts
    # touching tracked files that match the filter, the bot's own push is
    # still skipped here, mirroring the "[skip build]" logic in build.yml;
    # the scheduled and manual runs are unaffected.
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    outputs:
      checks: ${{ steps.norm.outputs.checks }}
      components: ${{ steps.norm.outputs.components }}
      python_version: ${{ steps.pyver.outputs.version }}
      python_suffix: ${{ steps.pyver.outputs.suffix }}
      python_digest: ${{ steps.pyver.outputs.digest }}
      uv_version: ${{ steps.uvver.outputs.version }}
      uv_digest: ${{ steps.uvver.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Normalize checks csv (empty = all)
        id: norm
        run: |
          raw="${{ github.event_name == 'workflow_dispatch' && inputs.checks || '' }}"
          if [ -z "$raw" ]; then
            raw_expanded="python,uv,intermediate,probes,python-minor"
          else
            raw_expanded="$raw"
          fi
          echo "checks=$raw_expanded" >> "$GITHUB_OUTPUT"
          # Dynamic matrix for bump-base: only the selected components become
          # matrix entries. The matrix context is unavailable in job-level if,
          # so filtering happens here instead of a job condition.
          # $checks here is the OUTPUT name, not a shell variable - under
          # set -u referencing it crashes ("unbound variable"). Use the
          # normalized value we already hold in $raw_expanded instead.
          comp_json="["
          first=1
          for c in python uv; do
            case ",$raw_expanded," in
              *",$c,"*)
                if [ $first -eq 0 ]; then comp_json="$comp_json,"; fi
                comp_json="$comp_json{\"component\":\"$c\"}"
                first=0
                ;;
            esac
          done
          comp_json="$comp_json]"
          echo "components=$comp_json" >> "$GITHUB_OUTPUT"

      - name: Read pinned python version
        id: pyver
        uses: ./.github/actions/read-python-version

      - name: Read pinned uv version
        id: uvver
        uses: ./.github/actions/read-uv-version

  # Base image freshness: one job with a component matrix replaces the two
  # near-identical check-python-version / check-uv-version workflows.
  # A matrix with zero entries is a hard strategy error in GitHub Actions
  # (same constraint the probe job guards against), so when no base-image
  # check is selected the components output is "[]" and this job is gated
  # by an if on that value instead.
  bump-base:
    needs: versions
    if: needs.versions.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.components) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Get current pin (${{ matrix.component }})
        id: current
        run: |
          if [ "${{ matrix.component }}" = "python" ]; then
            version="${{ needs.versions.outputs.python_version }}"
            suffix="${{ needs.versions.outputs.python_suffix }}"
            digest="${{ needs.versions.outputs.python_digest }}"
          else
            version="${{ needs.versions.outputs.uv_version }}"
            suffix=""
            digest="${{ needs.versions.outputs.uv_digest }}"
          fi
          version_re="${version//./\\.}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version_re=$version_re" >> "$GITHUB_OUTPUT"

      - name: Get latest matching version (${{ matrix.component }})
        id: latest
        run: |
          if [ "${{ matrix.component }}" = "python" ]; then
            minor=$(echo "${{ steps.current.outputs.version }}" | cut -d. -f1,2)
            minor_re="${minor//./\\.}"
            suffix="${{ steps.current.outputs.suffix }}"
            latest=$(curl -sf "https://raw.githubusercontent.com/docker-library/official-images/master/library/python" \
              | grep "^Tags: " \
              | grep -oE "${minor_re}\.[0-9]+-${suffix}" \
              | sed "s/-${suffix}\$//" \
              | sort -V | tail -1) || true
            ref="python:${latest}-${suffix}"
          else
            latest=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/astral-sh/uv/releases/latest \
              | jq -r .tag_name | sed 's/^v//') || true
            ref="ghcr.io/astral-sh/uv:${latest}"
          fi
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Failed to resolve latest version for ${{ matrix.component }}"
            exit 1
          fi
          # Validate the resolved tag before it reaches sed -i / echo: registry
          # data is untrusted external input, and only-emptiness checks let a
          # shell metacharacter ride into the Dockerfile rewrite below. The
          # python path is already tightly constrained by its grep -oE pattern
          # (digits, dots and the suffix only); the uv path (jq tag_name) is
          # the one this guard closes: digits and dots, optional leading v.
          if ! printf '%s' "$latest" | grep -qE '^v?[0-9]+([.][0-9]+)*$'; then
            echo "::error::latest version '$latest' failed format validation (expected ^v?[0-9.]+$)"
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Resolve digest of latest (${{ matrix.component }})
        id: latest_digest
        run: |
          digest=$(crane digest "${{ steps.latest.outputs.ref }}")
          # Validate the digest before interpolation: a compromised registry
          # response could otherwise ride into the Dockerfile FROM rewrite
          # below via sed -i. Only sha256:<64 hex> is a legitimate digest.
          if ! printf '%s' "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::digest failed format validation (expected sha256:<64 hex>): $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Compare and build PR title (${{ matrix.component }})
        id: compare
        run: |
          if [ "${{ steps.current.outputs.digest }}" = "${{ steps.latest_digest.outputs.digest }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.component }} is up to date"
            exit 0
          fi
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          cur="${{ steps.current.outputs.version }}"
          new="${{ steps.latest.outputs.version }}"
          if [ "${{ matrix.component }}" = "python" ]; then
            suf="${{ steps.current.outputs.suffix }}"
            if [ "$cur" = "$new" ]; then
              echo "pr_title=build(deps): refresh pinned digest for python:${cur}-${suf}" >> "$GITHUB_OUTPUT"
            else
              echo "pr_title=build(deps): bump python from ${cur} to ${new}" >> "$GITHUB_OUTPUT"
            fi
            echo "image_ref=python:${new}-${suf}" >> "$GITHUB_OUTPUT"
          else
            if [ "$cur" = "$new" ]; then
              echo "pr_title=build(deps): refresh pinned digest for uv ${cur}" >> "$GITHUB_OUTPUT"
            else
              echo "pr_title=build(deps): bump uv from ${cur} to ${new}" >> "$GITHUB_OUTPUT"
            fi
            echo "image_ref=ghcr.io/astral-sh/uv:${new}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile (${{ matrix.component }})
        if: steps.compare.outputs.up_to_date == 'false' && github.event_name != 'pull_request'
        env:
          NEW_REF: ${{ steps.compare.outputs.image_ref }}
          NEW_DIGEST: ${{ steps.latest_digest.outputs.digest }}
          CUR_VERSION_RE: ${{ steps.current.outputs.version_re }}
          CUR_SUFFIX: ${{ steps.current.outputs.suffix }}
        run: |
          # NEW_REF/NEW_DIGEST/CUR_* arrive via env indirection (validated in
          # the steps above: tag against ^v?[0-9.]+$ and digest against
          # ^sha256:<64 hex>), so untrusted registry data cannot break out of
          # the sed patterns or ride into the Dockerfile rewrite unfiltered.
          if [ "${{ matrix.component }}" = "python" ]; then
            sed -i -E "s|^FROM python:${CUR_VERSION_RE}-${CUR_SUFFIX}(@sha256:[0-9a-f]+)?|FROM ${NEW_REF}@${NEW_DIGEST}|" Dockerfile
          else
            sed -i "s|FROM ghcr.io/astral-sh/uv:.*|FROM ${NEW_REF}@${NEW_DIGEST} AS uv|" Dockerfile
          fi

      - name: Create pull request (${{ matrix.component }})
        if: steps.compare.outputs.up_to_date == 'false' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}
          commit-message: "${{ steps.compare.outputs.pr_title }}"
          title: "${{ steps.compare.outputs.pr_title }}"
          body: |
            Bumps the pinned base image in the Dockerfile (line 1-2) to the latest upstream release, with the new digest.

            New digest: `${{ steps.latest_digest.outputs.digest }}`
          branch: bump-${{ matrix.component }}-version
          labels: dependencies,docker
          delete-branch: true

  # Transitive dependency refresh: uv lock --upgrade against main's pins,
  # PR when the lock actually moved. Runs before probes so both jobs work
  # against main's uv.lock in a deterministic order (replaces the old
  # 20:00 -> 22:00 clock staggering).
  intermediate-deps:
    needs: versions
    if: contains(needs.versions.outputs.checks, 'intermediate')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ needs.versions.outputs.uv_version }}

      - name: Upgrade lock file
        run: uv lock --upgrade

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute bump table
        id: table
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/summarize-deps
        with:
          body-path: /tmp/dep_bump_body.md
      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}
          add-paths: uv.lock
          commit-message: "build(deps): upgrade transitive dependencies in uv.lock"
          title: "build(deps): upgrade transitive dependencies in uv.lock"
          body-path: /tmp/dep_bump_body.md
          branch: upgrade-intermediate-deps
          labels: dependencies
          delete-branch: true

  # Compatibility probes for previously excluded packages. Probe logic is
  # unchanged from check-dependency-probes.yml (guard fixed in #79); only
  # the trigger wiring moved here. Needs intermediate-deps to preserve the
  # old clock staggering semantics in explicit form: probes start only after
  # the lock refresh job has finished (success or skipped), so a scheduled
  # run never interleaves the two uv.lock consumers.
  dependency-probes:
    needs: [versions, intermediate-deps]
    if: always() && contains(needs.versions.outputs.checks, 'probes') && needs.versions.result == 'success' && (needs.intermediate-deps.result == 'success' || needs.intermediate-deps.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      uv_version: ${{ needs.versions.outputs.uv_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build matrix from candidates.json
        id: set
        env:
          PROBE_ONLY: ${{ inputs.probe_only }}
        run: |
          # inputs.probe_only is dispatch-user controlled, so it arrives via
          # env indirection (same pattern as the validate step): a value with
          # a newline would otherwise inject a line into this script at step
          # setup.
          only="$PROBE_ONLY"
          if [ -n "$only" ]; then
            matrix=$(jq -c --arg only "$only" '[.[] | select(.name == $only)]' .github/dep-probes/candidates.json)
            # Fail loudly instead of silently producing an empty matrix -- an empty
            # match here almost always means a typo/whitespace in probe_only, not
            # an intentional "nothing to probe" state.
            if [ "$matrix" = "[]" ]; then
              echo "::error::probe_only='$only' matched no entry in candidates.json"
              exit 1
            fi
          else
            matrix=$(jq -c . .github/dep-probes/candidates.json)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  probe:
    needs: dependency-probes
    # A matrix with zero entries is a hard error in GitHub Actions, so this
    # guards the case where probe_only doesn't match any candidate name.
    # always() is required because the transitive needs closure includes
    # intermediate-deps: when it is skipped (checks=probes), GitHub skips
    # dependents whose if lacks always() regardless of their direct parent's
    # success - seen in practice as probe silently skipped on partial runs.
    if: always() && needs.dependency-probes.result == 'success' && needs.dependency-probes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.dependency-probes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate candidates.json entry
        id: validate
        env:
          CAND_NAME: ${{ matrix.name }}
          CAND_GROUP: ${{ matrix.group }}
          CAND_VERSION: ${{ matrix.version }}
          CAND_NOTE: ${{ matrix.note }}
          CAND_SMOKE_TEST: ${{ matrix.smoke_test }}
        run: |
          # candidates.json entries are interpolated raw into shell and Python
          # further down (uv add, sed -i, python -c, git mv), so a malformed
          # value would execute on the runner instead of failing cleanly. The
          # file is repo-controlled, but its other writers are unreviewed
          # surfaces: a PR editing it lands here directly, and a manual edit
          # can carry a stray shell metacharacter. Validate the same way the
          # bump-base job validates registry data (the tag and digest guards
          # in the "Get latest matching version" / "Resolve digest of latest"
          # steps): strict format regex before any interpolation, fail loudly
          # before the probe consumes the entry. The values arrive via env
          # indirection, not script-text interpolation: GitHub expands template
          # syntax anywhere in the script text (comments included) at step
          # setup, before any check runs, so a value carrying a newline would
          # inject a line into the script itself.
          name="$CAND_NAME"
          group="$CAND_GROUP"
          version="$CAND_VERSION"
          note="$CAND_NOTE"
          smoke_test="$CAND_SMOKE_TEST"
          # Reject newlines first: grep matches per line, so the whole-string
          # anchored checks below pass a value whose first line matches the
          # allowlist even when the rest of the value is an injected command.
          # name / group / version / smoke_test are interpolated into the
          # script text of the steps further down, so an embedded newline
          # there would inject a line at step setup. NUL bytes cannot reach
          # here: they cannot survive execve env passing, and the env block
          # above fails the job outright on one.
          newline_check() {
            case "$1" in
              *$'\n'*|*$'\r'*)
                echo "::error::candidates.json '$2' contains a newline or carriage return"
                exit 1
                ;;
            esac
          }
          newline_check "$name" name
          newline_check "$group" group
          newline_check "$version" version
          newline_check "$note" note
          newline_check "$smoke_test" smoke_test
          if ! printf '%s' "$name" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::candidates.json 'name' failed format validation: '$name'"
            exit 1
          fi
          if ! printf '%s' "$group" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::candidates.json 'group' failed format validation: '$group'"
            exit 1
          fi
          # Flat allowlist: PEP 508-ish version punctuation, extras brackets and
          # separators only. Everything that could break out of the double-quoted
          # context the value is interpolated into downstream (double quote,
          # dollar, backtick, backslash) is outside the class, so a match here
          # proves the value is safe to interpolate. A nested-char alternation
          # like \[[^]]*\] would NOT prove that: it accepts " and $ inside the
          # brackets. The field is optional (entries without a version resolve
          # latest), and an empty value is legitimate: the -n guard keeps grep
          # from seeing zero input bytes, which match nothing and would fail
          # every current candidate.
          if [ -n "$version" ] && ! printf '%s' "$version" | grep -qE '^[][A-Za-z0-9.!=<>~^ ,;:+-]*$'; then
            echo "::error::candidates.json 'version' failed format validation: '$version'"
            exit 1
          fi
          # The note only feeds the Summary step, but it is interpolated into a
          # double-quoted assignment there: a double quote closes the string, a
          # dollar or backtick runs command substitution even inside double
          # quotes. grep -F (literal, no regex) per character keeps the check
          # unambiguous.
          if printf '%s' "$note" | grep -qF '"' \
            || printf '%s' "$note" | grep -qF '$' \
            || printf '%s' "$note" | grep -qF '`'; then
            echo "::error::candidates.json 'note' contains a shell metacharacter (double quote, dollar or backtick)"
            exit 1
          fi
          # Strict path shape: exactly one filename segment under the probe
          # tests directory, alnum/dot/underscore/hyphen only, .py suffix. A
          # prefix check alone would let $(...) or a quote ride into the later
          # git mv / file-existence test, where command substitution executes
          # inside double quotes; the single-segment rule also makes '..'
          # traversal impossible. Matches the check_<name>.py convention the
          # probe scripts use.
          if [ -n "$smoke_test" ]; then
            if ! printf '%s' "$smoke_test" | grep -qE '^\.github/dep-probes/tests/[A-Za-z0-9][A-Za-z0-9._-]*\.py$'; then
              echo "::error::candidates.json 'smoke_test' must match .github/dep-probes/tests/<name>.py (alnum/dot/underscore/hyphen only): '$smoke_test'"
              exit 1
            fi
            if [ ! -f "$smoke_test" ]; then
              echo "::error::candidates.json 'smoke_test' file not found: '$smoke_test'"
              exit 1
            fi
          fi

      - name: Check if already enabled
        id: guard
        run: |
          # Strip an extras suffix (tsfresh[dask] -> tsfresh) before matching:
          # in a regex the raw brackets form a character class, so the raw
          # name would miss the pyproject entry. The optional (\[[^]]*\])?
          # group then matches extras whether the candidate records them
          # in its name or not.
          name="${{ matrix.name }}"
          base="${name%%\[*}"
          if grep -v '^\s*#' pyproject.toml | grep -qP "\"${base}(\[[^]]*\])?(==|>=|<=|~=|!=|\")"; then
            echo "already present in pyproject.toml, skipping probe"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ needs.dependency-probes.outputs.uv_version }}

      - name: Sync base environment (sanity check)
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --locked --all-groups

      - name: Try adding ${{ matrix.name }}
        id: add
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          spec="${{ matrix.name }}${{ matrix.version }}"
          uv add --group "${{ matrix.group }}" "$spec"

      - name: Pin exact resolved version
        id: pin
        if: steps.add.outcome == 'success'
        run: |
          # The lock lookup must use the base name: uv.lock lists the package
          # as "tsfresh", not "tsfresh[dask]" (extras live in the requiring
          # spec), so the raw name would exit with "not found in uv.lock".
          # The sed keeps the full name with extras in pyproject.
          name="${{ matrix.name }}"
          base="${name%%\[*}"
          exact=$(uv run python -c "
          import tomllib
          with open('uv.lock', 'rb') as f:
              lock = tomllib.load(f)
          for pkg in lock['package']:
              if pkg['name'] == '${base}':
                  print(pkg['version'])
                  break
          else:
              raise SystemExit('${base} not found in uv.lock')
          ")
          # Expose the resolved pin as a step output: the ceiling step below
          # reads steps.pin.outputs.version. Without this wiring it
          # interpolates as empty, the ceiling paragraph degrades to
          # "resolved at ``", and any candidate resolved AT latest gets a
          # false ceiling annotation (latest non-empty, != empty).
          echo "version=${exact}" >> "$GITHUB_OUTPUT"
          sed -i -E "s/\"${base}(\[[^]]*\])?[<>=!~ ][^\"]*\"/\"${{ matrix.name }}==${exact}\"/" pyproject.toml
          uv lock

      - name: Compare resolved version against upstream latest
        id: ceiling
        if: steps.add.outcome == 'success'
        run: |
          # The resolver backs off from any release whose requirements conflict
          # with an existing pin. uv add can therefore "succeed" at a version
          # BELOW upstream latest without any error: the probe for
          # statsforecast resolved 2.0.1 while 2.1.1 was already the latest,
          # because the 2.1.x line declares pandas<3.0 and pandas==3.0.x is
          # pinned. Left unguarded, that success produced an enable-dep PR
          # with no availability signal and Dependabot's nightly direct-bump
          # failed every run after merge (seen in practice as
          # dependency_file_not_resolvable on mlforecast/statsforecast).
          # Emit the ceiling as outputs for the update-availability gate in
          # the removal step below, and as a warning at probe time.
          # The lookup must use the base name: uv.lock lists the package as
          # "tsfresh", not "tsfresh[dask]".
          name="${{ matrix.name }}"
          base="${name%%\[*}"
          resolved="${{ steps.pin.outputs.version }}"
          latest=$(curl -sf "https://pypi.org/pypi/${base}/json" | jq -r .info.version) || latest=""
          # Loose format guard: this value feeds warnings and PR text only
          # (never sed -i), so a single-line PEP 440-ish shape with no shell
          # metacharacters is enough; a curl outage leaves it empty and the
          # no-ceiling path below runs unchanged.
          if [ -n "$latest" ] && ! printf '%s' "$latest" | grep -qE '^[A-Za-z0-9.+-]+$'; then
            echo "::error::pypi latest version '$latest' failed format validation"
            exit 1
          fi
          if [ -n "$latest" ] && [ "$latest" != "$resolved" ]; then
            echo "ceiling=true" >> "$GITHUB_OUTPUT"
            echo "latest_version=$latest" >> "$GITHUB_OUTPUT"
            echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
            echo "::warning::${base} resolved at ${resolved} but upstream latest is ${latest}."
            echo "::warning::The newer release is unreachable for this pinned stack (requirements conflict)."
            echo "::warning::Dependabot's nightly direct-bump would fail after such a merge; the update-availability gate below keeps the candidate queued instead."
          else
            echo "ceiling=false" >> "$GITHUB_OUTPUT"
            echo "latest_version=$latest" >> "$GITHUB_OUTPUT"
            echo "${base} resolved at the upstream latest (${resolved}): no ceiling"
          fi

      - name: Run smoke test for ${{ matrix.name }}
        if: steps.guard.outputs.skip != 'true' && steps.add.outcome == 'success'
        id: smoke
        continue-on-error: true
        run: |
          # The fallback import must use the base name: "import tsfresh[dask]"
          # is a Python SyntaxError (a subscript is not part of an import
          # statement); extras are pulled in by the uv environment itself.
          name="${{ matrix.name }}"
          base="${name%%\[*}"
          test_path="${{ matrix.smoke_test }}"
          if [ -n "$test_path" ] && [ -f "$test_path" ]; then
            uv run --all-groups python -P "$test_path"
          else
            uv run --all-groups python -P -c "import ${base}"
          fi

      - name: Remove ${{ matrix.name }} from tracked candidates
        run: |
          # Update-availability gate (the check after the update-to-latest
          # attempt): the candidate is removed and the enable-dep PR opened
          # ONLY when resolution actually reached upstream latest. uv add can
          # succeed BELOW latest without any error (the resolver backs off
          # from releases whose requirements conflict with an existing pin -
          # statsforecast resolved 2.0.1 while 2.1.1 was latest), so success
          # alone proves nothing about availability, and merging such a pin
          # recreates the daily Dependabot failure state
          # (dependency_file_not_resolvable). Below latest the removal and
          # the PR steps are skipped and the ::warning:: marks the state; the
          # nightly run re-verifies the candidate until the conflict resolves
          # upstream. The job stays green on purpose: a red nightly run for a
          # known, documented ceiling would re-create the red-X
          # desensitization the retire-forecast-probes PR removed.
          if [ "${{ steps.add.outcome }}" == 'success' ] && [ "${{ steps.smoke.outcome }}" == 'success' ] && [ "${{ steps.ceiling.outputs.ceiling }}" == 'true' ]; then
            echo "::warning::${{ matrix.name }} resolved at ${{ steps.ceiling.outputs.resolved }} but upstream latest is ${{ steps.ceiling.outputs.latest_version }}."
            echo "::warning::Update-availability check failed: resolution cannot reach upstream latest for this pinned stack."
            echo "::warning::Candidate stays queued; no enable-dep PR is opened; the nightly run re-verifies until the conflict resolves."
            exit 0
          fi
          if [ "${{ steps.add.outcome }}" == 'success' ] && [ "${{ steps.smoke.outcome }}" == 'success' ]; then
            tmp=$(mktemp)
            jq --arg name "${{ matrix.name }}" 'map(select(.name != $name))' .github/dep-probes/candidates.json > "$tmp"
            mv "$tmp" .github/dep-probes/candidates.json
          fi

      - name: Fold ${{ matrix.name }} smoke test into tests/smoke
        if: steps.add.outcome == 'success' && steps.smoke.outcome == 'success' && steps.ceiling.outputs.ceiling != 'true'
        run: |
          # Smoke tests live as standalone scripts under tests/smoke/, one per
          # library, and build.yml's smoke-test job loops over tests/smoke/*.py
          # and pipes each into the container. So "folding" a probe into
          # permanent coverage is just a move - no build.yml step to insert.
          # The probe script is already a standalone module with a main()
          # guard, so it moves in unchanged (renamed to the test_<name>.py
          # convention). git mv (not cp) removes the probe from
          # .github/dep-probes/tests/ in the same commit. Idempotent: a second
          # pass sees the target present and leaves both files untouched.
          test_path="${{ matrix.smoke_test }}"
          name="${{ matrix.name }}"
          target="tests/smoke/test_${name}.py"

          if [ -z "$test_path" ]; then
            echo "no smoke_test path recorded, skipping fold"
            exit 0
          fi
          if [ ! -f "$test_path" ]; then
            echo "::error::smoke test script not found: $test_path"
            exit 1
          fi
          if [ -f "$target" ]; then
            echo "$target already present, skipping fold"
            exit 0
          fi

          mkdir -p tests/smoke
          git mv "$test_path" "$target"

      - name: Create pull request
        if: steps.add.outcome == 'success' && steps.smoke.outcome == 'success' && steps.ceiling.outputs.ceiling != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}
          add-paths: |
            pyproject.toml
            uv.lock
            .github/dep-probes/candidates.json
            .github/dep-probes/tests
            tests/smoke
          commit-message: "build(deps): enable ${{ matrix.name }} (compatibility probe passed)"
          title: "build(deps): enable ${{ matrix.name }} (compatibility probe passed)"
          body: |
            Automated compatibility probe for `${{ matrix.name }}` succeeded: dependency resolution and the smoke test both passed against the currently pinned stack. Review the resolved version in pyproject.toml/uv.lock before merging.

            This PR also removes `${{ matrix.name }}` from `.github/dep-probes/candidates.json`, since it will no longer be excluded once merged, and folds `${{ matrix.smoke_test }}` into `tests/smoke/`, where the smoke-test loop picks it up automatically, so future ${{ matrix.name }} version bumps get the same regression coverage as the rest of the ML stack.

          branch: enable-dep-${{ matrix.name }}
          labels: dependencies,compatibility-probe
          delete-branch: true

      - name: Summary
        if: always()
        env:
          CAND_NAME: ${{ matrix.name }}
          CAND_NOTE: ${{ matrix.note }}
        run: |
          # matrix.name / matrix.note arrive via env indirection: this step has
          # if: always(), so it runs even when the validate step above FAILED,
          # and its script text is interpolated at step setup regardless of
          # that outcome. Direct interpolation here would let an unvalidated
          # candidates.json value execute unconditionally; every other
          # consumer of the entry is skipped by the job abort after a failed
          # validate step, so it interpolates only already-validated values.
          {
            echo "### $CAND_NAME"
            if [ "${{ steps.guard.outputs.skip }}" = "true" ]; then
              echo "already enabled in pyproject.toml - remove it from candidates.json"
            elif [ "${{ steps.add.outcome }}" != "success" ]; then
              echo "resolution failed - still incompatible"
            elif [ "${{ steps.smoke.outcome }}" != "success" ]; then
              echo "resolution OK, smoke test failed"
            elif [ "${{ steps.ceiling.outputs.ceiling }}" = "true" ]; then
              echo "update-availability check FAILED: resolved BELOW upstream latest ${{ steps.ceiling.outputs.latest_version }} (requirements conflict) - candidate stays queued, no PR opened"
            else
              echo "compatible at upstream latest - PR opened (enable-dep-$(echo "$CAND_NAME" | tr -cd 'A-Za-z0-9._-'))"
            fi
            note="$CAND_NOTE"
            if [ -n "$note" ]; then
              echo "note: $note"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Python minor-version crossing (e.g. 3.13 -> 3.14). bump-base keeps the
  # pinned MINOR fresh (3.13.15 -> 3.13.16 patch bumps, digest refreshes) but
  # deliberately never proposes a new minor: a crossing swaps the whole wheel
  # set (cp313 -> cp314), widens requires-python and re-resolves uv.lock,
  # which a digest-refresh sed cannot validate. This job closes that gap with
  # the same gate-before-PR contract as the dependency probes.
  #
  # Ladder semantics: docker-library may publish tags on several minors above
  # the pin (3.14.x and 3.15.y slim-trixie). Candidates are evaluated in
  # ASCENDING minor order, and the PR is opened for the FIRST one that
  # passes - never a skip over a ready intermediate minor (each minor gets its
  # own image and Docker Hub tag as a real artifact) and never a deadlock on
  # the newest minor while an older one is ready (a fresh .0 release ships
  # no cp315 wheels for the heavy stack; bump-to-top would gate on it for
  # weeks while ignoring a fully ready 3.14). A higher minor is tried only
  # when every lower candidate failed the gate; failures cost one uv sync
  # (~5-8 min) each and the ladder keeps the job green either way (same
  # reasoning as the probe update-availability gate: a red nightly for a
  # known-unready crossing re-creates red-X desensitization).
  #
  # While a crossing PR is open, each later run re-evaluates from current
  # main and force-updates the SAME branch (the pinned minor has not moved
  # until merge), so open branches never accumulate: with the pin at 3.13
  # the ladder always lands on migrate-python-3.14, and migrate-python-3.15
  # becomes a candidate only after the 3.14 crossing merges.
  python-minor:
    needs: [versions, intermediate-deps]
    # Same always() shape as the probe job: python-minor also rewrites
    # uv.lock in its own workspace and opens a PR carrying it, so it runs
    # after the intermediate-deps lock consumer (success or skipped) and
    # never interleaves the two. The comma-delimited component builder in the
    # versions job does NOT list python-minor, so a checks=python-minor
    # dispatch selects only this job (the case pattern ",python," does not
    # match "python-minor").
    if: always() && contains(needs.versions.outputs.checks, 'python-minor') && needs.versions.result == 'success' && (needs.intermediate-deps.result == 'success' || needs.intermediate-deps.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read current python pin
        id: current
        run: |
          version="${{ needs.versions.outputs.python_version }}"
          suffix="${{ needs.versions.outputs.python_suffix }}"
          minor=$(echo "$version" | cut -d. -f1,2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - name: Build ascending candidate ladder
        id: ladder
        run: |
          # Same source as bump-base (docker-library official-images), but the
          # grep spans ALL minors instead of being anchored to the current
          # one. rc/pre-release tags cannot match the digits-only pattern.
          # For every minor above the pin keep only its NEWEST patch tag
          # (sort -V per minor), then order the minors ascending. Pure
          # sort/awk/cut - no jq - so the pipeline is reproducible locally.
          suffix="${{ steps.current.outputs.suffix }}"
          current_minor="${{ steps.current.outputs.minor }}"
          tags=$(curl -sf "https://raw.githubusercontent.com/docker-library/official-images/master/library/python" \
            | grep "^Tags: " \
            | grep -oE "[0-9]+\.[0-9]+\.[0-9]+-${suffix}" \
            | sort -V -u) || true
          if [ -z "$tags" ]; then
            echo "::error::no ${suffix} tags found in docker-library official-images"
            exit 1
          fi
          # one newest patch tag per minor above the pin, ascending by minor.
          # Input order after sort -V is ascending by version, so awk's
          # last-write-wins per minor keeps the highest patch. Minor compare
          # is numeric, NOT string: a string compare would rank "3.9" above
          # "3.10" (lexical) and the walk would try the wrong candidate
          # first. The split must live in BEGIN: split() is a function, and
          # a function call is not a valid pattern, so a pattern-position
          # split() is a syntax error that silently degrades the filter.
          ladder=$(echo "$tags" | sed "s/-${suffix}\$//" | awk -F. -v cur="$current_minor" '
            BEGIN { split(cur, c, "."); ch = (c[1]+0)*100 + (c[2]+0) }
            ($1+0)*100 + ($2+0) <= ch { next }
            { minor[$1 "." $2] = $0 }
            END { for (m in minor) print minor[m] }' | sort -V)
          if [ -z "$ladder" ]; then
            echo "no minors above ${current_minor} with a ${suffix} tag: nothing to cross"
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ladder (ascending):"; echo "$ladder" | sed "s/^/  candidate /"
          # Outputs: newline-delimited list for the gate loop, count, and the
          # first (nearest) candidate for messages.
          first=$(echo "$ladder" | head -1)
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          echo "ladder<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ladder" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$ladder" | wc -l)" >> "$GITHUB_OUTPUT"
          echo "first=$first" >> "$GITHUB_OUTPUT"

      - name: Install crane
        if: steps.ladder.outputs.up_to_date == 'false'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Install uv
        if: steps.ladder.outputs.up_to_date == 'false'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ needs.versions.outputs.uv_version }}

      - name: Walk the ladder until a candidate passes
        id: walk
        if: steps.ladder.outputs.up_to_date == 'false' && github.event_name != 'pull_request'
        env:
          LADDER: ${{ steps.ladder.outputs.ladder }}
          CURRENT_MINOR: ${{ steps.current.outputs.minor }}
          SUFFIX: ${{ steps.current.outputs.suffix }}
        run: |
          # Ascending walk. Per candidate: resolve+validate the digest, apply
          # the pin rewrites, then run the two gates (resolve+install from
          # prebuilt wheels; top-level import contract). The FIRST candidate
          # that passes both is written to the outputs and the loop exits.
          # A failed candidate is reverted with git checkout -- (the runner
          # tree is expendable) and the next one starts from clean pins.
          # Everything is captured into $results for the Summary; a hard
          # error (bad digest, curl outage) marks the candidate failed and
          # the walk continues - the job stays green unless EVERY candidate
          # fails, which is the queued state, not a nightly red.
          results=""
          chosen=""
          chosen_tag=""
          chosen_digest=""
          chosen_title=""
          old_minor="$CURRENT_MINOR"
          old_minor_re="${old_minor//./\\.}"
          suffix="$SUFFIX"
          while IFS= read -r new_version; do
            new_minor=$(echo "$new_version" | cut -d. -f1,2)
            new_tag="${new_version}-${suffix}"
            echo "=== candidate python:${new_tag} ==="
            verdict="gate FAILED (resolve/install from prebuilt wheels)"
            # digest: resolve + format-validate (same guard as bump-base;
            # untrusted registry data must not reach sed unfiltered)
            digest=$(crane digest "python:${new_tag}" 2>/dev/null) || {
              verdict="digest resolution failed"
              echo "::warning::python:${new_tag}: $verdict"
              results="${results}${new_minor}|${verdict}"$'\n'
              continue
            }
            if ! printf '%s' "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              verdict="digest failed format validation"
              echo "::warning::python:${new_tag}: $verdict ($digest)"
              results="${results}${new_minor}|${verdict}"$'\n'
              continue
            fi
            if ! printf '%s' "$new_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              verdict="version failed format validation"
              echo "::warning::python:${new_tag}: $verdict ($new_version)"
              results="${results}${new_minor}|${verdict}"$'\n'
              continue
            fi
            # pin rewrites (env-indirected validated values, same as
            # bump-base; README rules are boundary-guarded: the historical
            # versioning example says "Python 3.13.14" and a bare
            # "Python 3\.13" match would mangle it into "Python 3.14.14")
            next_minor=$(echo "$new_minor" | awk -F. '{print $1 "." $2 + 1}')
            sed -i -E "s|^FROM python:${old_minor_re}\.[0-9]+-${suffix}(@sha256:[0-9a-f]+)?|FROM python:${new_tag}@${digest}|" Dockerfile
            sed -i -E "s|^requires-python = \"[^\"]*\"|requires-python = \">=${new_minor},<${next_minor}\"|" pyproject.toml
            sed -i -E -e "/lgbm_gpu/!s|${old_minor_re}\.x|${new_minor}.x|g" -e "/lgbm_gpu/!s@Python ${old_minor_re}([^.0-9]|$)@Python ${new_minor}\1@g" README.md
            # gate 1: the full pinned stack resolves and installs from
            # prebuilt wheels under the new window. --no-build is the image's
            # no-compiler contract: the runner has a toolchain, the image
            # does not, so a source-only package would silently build here
            # and then break the real image build. uv downloads the CPython
            # matching the new window automatically.
            if uv lock && uv sync --locked --all-groups --no-install-project --no-build; then
              # gate 2: same top-level import contract the in-container
              # smoke loop enforces, at gate scope. The full smoke suite
              # runs against the crossing PR's own image build in build.yml.
              if uv run --locked --all-groups python -P tests/smoke/test_all_top_level_imports.py; then
                chosen="$new_version"
                chosen_tag="$new_tag"
                chosen_digest="$digest"
                chosen_title="build(deps): migrate python from ${old_minor} to ${new_minor}"
                results="${results}${new_minor}|gate passed"$'\n'
                echo "candidate python:${new_tag} passed both gates"
                break
              else
                verdict="gate FAILED (top-level import contract)"
                echo "::warning::python:${new_tag}: $verdict"
                results="${results}${new_minor}|${verdict}"$'\n'
              fi
            else
              echo "::warning::python:${new_tag}: $verdict"
              results="${results}${new_minor}|${verdict}"$'\n'
            fi
            # revert this candidate's rewrites before the next attempt
            git checkout -- Dockerfile pyproject.toml README.md uv.lock 2>/dev/null || true
          done < <(echo "$LADDER")
          if [ -n "$results" ]; then
            {
              echo "results<<EOF"
              printf '%s' "$results"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$chosen" ]; then
            echo "chosen=$chosen" >> "$GITHUB_OUTPUT"
            echo "chosen_tag=$chosen_tag" >> "$GITHUB_OUTPUT"
            echo "chosen_digest=$chosen_digest" >> "$GITHUB_OUTPUT"
            echo "chosen_minor=$(echo "$chosen" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
            echo "chosen_title=$chosen_title" >> "$GITHUB_OUTPUT"
          fi
          echo "walk complete: chosen=${chosen:-none}"

      - name: Open crossing pull request
        if: steps.ladder.outputs.up_to_date == 'false' && github.event_name != 'pull_request' && steps.walk.outputs.chosen != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}
          add-paths: |
            Dockerfile
            pyproject.toml
            uv.lock
            README.md
          commit-message: "${{ steps.walk.outputs.chosen_title }}"
          title: "${{ steps.walk.outputs.chosen_title }}"
          body: |
            Automated python minor-version crossing opened by the python-minor ladder in check-upstream.yml: the pinned base image moves to python:${{ steps.walk.outputs.chosen_tag }} (digest pinned) and the requires-python window widens to the new minor, so uv.lock re-resolves onto the new interpreter's wheel set.

            Candidates above the pin are evaluated in ascending minor order and this PR carries the first one that passed both gates - never a skip over a ready intermediate minor, never a deadlock on the newest minor while an older one is ready. Gate evidence from the run that opened this PR: `uv lock` resolved the full pinned stack under the widened window, `uv sync --locked --all-groups --no-install-project --no-build` installed every locked package from prebuilt wheels (--no-build mirrors the image's no-compiler constraint on a runner that has one), and the top-level import contract (tests/smoke/test_all_top_level_imports.py) passed on the new CPython.

            Everything else is owned by existing automation: stamp-date derives the new version prefix from the Dockerfile FROM line, the build.yml smoke suite (all tests/smoke scripts, JupyterLab boot, kernel registration, extension resolution) runs against this PR's built image before merge, and README's feature line and supported-tags table are updated to the new minor placeholder.

            While this PR is open, each later nightly python-minor run re-evaluates from current main and force-updates this branch with the fresh patch tag and digest, so the PR never goes stale.
          branch: migrate-python-${{ steps.walk.outputs.chosen_minor }}
          labels: dependencies,docker
          delete-branch: true

      - name: Summary
        if: always()
        env:
          RESULTS: ${{ steps.walk.outputs.results }}
        run: |
          {
            echo "### python minor crossing"
            if [ "${{ steps.ladder.outputs.up_to_date }}" = "true" ]; then
              echo "pinned minor is the newest upstream: nothing to cross"
            elif [ -z "${{ steps.walk.outputs.chosen }}" ] && [ "${{ steps.ladder.outputs.up_to_date }}" != "false" ]; then
              echo "upstream discovery failed - see the job log"
            elif [ -z "${{ steps.walk.outputs.chosen }}" ]; then
              echo "every candidate failed the gate: crossing stays queued, no PR opened, nightly re-verification"
            else
              echo "gate passed for python:${{ steps.walk.outputs.chosen_tag }}: PR opened (migrate-python-$(echo "${{ steps.walk.outputs.chosen }}" | cut -d. -f1,2))"
            fi
            if [ -n "$RESULTS" ]; then
              echo ""
              echo "| candidate | verdict |"
              echo "| - | - |"
              printf '%s\n' "$RESULTS" | while IFS='|' read -r minor verdict; do
                [ -n "$minor" ] && echo "| python ${minor} | ${verdict} |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
