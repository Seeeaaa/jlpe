name: Check python version
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
  pull_request:
    paths:
      - ".github/workflows/check-python-version.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check-python-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get current python version from Dockerfile
        id: current
        run: |
          full=$(grep -oP '(?<=^FROM python:)\S+' Dockerfile)
          version=$(echo "$full" | grep -oP '^[0-9.]+')
          suffix=$(echo "$full" | sed -E 's/^[0-9.]+-//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Get latest matching tag from Docker Hub
        id: latest
        run: |
          minor=$(echo "${{ steps.current.outputs.version }}" | cut -d. -f1,2)
          suffix="${{ steps.current.outputs.suffix }}"
          latest=$(curl -sf "https://raw.githubusercontent.com/docker-library/official-images/master/library/python" \
            | grep "^Tags: " \
            | grep -oE "${minor}\.[0-9]+-${suffix}" \
            | sed "s/-${suffix}\$//" \
            | sort -V | tail -1) || true
          if [ -z "$latest" ]; then
            echo "::error::No matching python:${minor}.x-${suffix} tag found in docker-library/official-images"
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          sed -i "s/FROM python:${{ steps.current.outputs.version }}-${{ steps.current.outputs.suffix }}/FROM python:${{ steps.latest.outputs.version }}-${{ steps.current.outputs.suffix }}/" Dockerfile

      - name: Create pull request
        if: steps.compare.outputs.up_to_date == 'false' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}
          commit-message: "build(deps): bump python from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          title: "build(deps): bump python from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          body: |
            Bumps Python from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}` in the Dockerfile.
          branch: bump-python-version
          labels: dependencies,docker
          delete-branch: true