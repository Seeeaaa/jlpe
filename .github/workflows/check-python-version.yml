name: Check python version
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
  pull_request:
    paths:
      - ".github/workflows/check-python-version.yml"
  schedule:
    - cron: "0 21 * * *"  # every day, 21:00 UTC
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check-python-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get current python version from Dockerfile
        id: current
        run: |
          line=$(grep '^FROM python:' Dockerfile)
          full=$(echo "$line" | grep -oP '(?<=^FROM python:)[^@\s]+')
          digest=""
          if [[ "$line" == *"@"* ]]; then
            digest="${line#*@}"
            digest="${digest%% *}"
          fi
          version=$(echo "$full" | grep -oP '^[0-9.]+')
          suffix=$(echo "$full" | sed -E 's/^[0-9.]+-//')
          version_re="${version//./\\.}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "version_re=$version_re" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Get latest matching tag from Docker Hub
        id: latest
        run: |
          minor=$(echo "${{ steps.current.outputs.version }}" | cut -d. -f1,2)
          minor_re="${minor//./\\.}"
          suffix="${{ steps.current.outputs.suffix }}"
          latest=$(curl -sf "https://raw.githubusercontent.com/docker-library/official-images/master/library/python" \
            | grep "^Tags: " \
            | grep -oE "${minor_re}\.[0-9]+-${suffix}" \
            | sed "s/-${suffix}\$//" \
            | sort -V | tail -1) || true
          if [ -z "$latest" ]; then
            echo "::error::No matching python:${minor}.x-${suffix} tag found in docker-library/official-images"
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Resolve digest of latest tag
        id: latest_digest
        run: |
          digest=$(crane digest python:${{ steps.latest.outputs.version }}-${{ steps.current.outputs.suffix }})
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.current.outputs.digest }}" = "${{ steps.latest_digest.outputs.digest }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "pr_title=build(deps): refresh pinned digest for python:${{ steps.current.outputs.version }}-${{ steps.current.outputs.suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_title=build(deps): bump python from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          sed -i -E "s|^FROM python:${{ steps.current.outputs.version_re }}-${{ steps.current.outputs.suffix }}(@sha256:[0-9a-f]+)?|FROM python:${{ steps.latest.outputs.version }}-${{ steps.current.outputs.suffix }}@${{ steps.latest_digest.outputs.digest }}|" Dockerfile

      - name: Create pull request
        if: steps.compare.outputs.up_to_date == 'false' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}
          commit-message: "${{ steps.compare.outputs.pr_title }}"
          title: "${{ steps.compare.outputs.pr_title }}"
          body: |
            ${{ steps.compare.outputs.pr_title }}.

            New digest: `${{ steps.latest_digest.outputs.digest }}`
          branch: bump-python-version
          labels: dependencies,docker
          delete-branch: true