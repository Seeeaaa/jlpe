name: Build and smoke test (main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only superseded PR checks. Push runs on main and manual
  # workflow_dispatch runs share the same group key (their github.ref is
  # identical - refs/heads/main) and must serialize, not cancel each other:
  # a manual force_push=true dispatch landing while a push build is mid-run
  # would otherwise kill it (with cancel-in-progress true) and could leave
  # Docker Hub with only a subset of the four tags, or interrupt stamp-date's
  # retry loop mid-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    # Same contract as check-upstream.yml: every run step executes under
    # bash with errexit, nounset and pipefail, so a failed version-extraction
    # grep or docker call fails its step immediately instead of feeding an
    # empty value downstream.
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  changes:
    runs-on: ubuntu-latest
    # [skip build] marks a commit made by stamp-date itself: without this
    # check, that commit's own push would re-trigger the whole pipeline for
    # content that was already built and pushed in the run that made it.
    # The stamp-date job guards this marker before pushing (see the
    # "Commit and push" step there); skip-build-notice below watches the
    # reverse case (marker present on a human commit that changes image
    # content). The marker only suppresses the pipeline when authored by the
    # bot (the sole legitimate emitter): requiring bot authorship prevents a
    # multi-commit push whose head carries "[skip build]" but whose earlier
    # commits touch image files from silently skipping the build.
    if: github.event_name == 'push' && !(contains(github.event.head_commit.message, '[skip build]') && github.event.head_commit.author.username == 'github-actions[bot]')
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            # Only these files define the actual image content.
            # Changes to .github/workflows/** must NOT trigger this.
            image:
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
  # This is the only job in the pipeline that pushes directly to main
  # instead of going through a PR. This is intentional: it lets version
  # stamping, build, smoke-test, and publish happen atomically in one
  # workflow run, without waiting on a separate PR to be merged.
  # Relies on the PAT_FOR_BOTS account being exempt from branch protection
  # (verify under Settings -> Branches if this job ever starts failing
  # with a permission error).
  stamp-date:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}

      - name: Read uv version from Dockerfile
        id: uvver
        uses: ./.github/actions/read-uv-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.uvver.outputs.version }}

      - name: Commit and push
        run: |
          msg="chore: sync uv.lock and bump image version date [skip build]"

          # Guard: the whole no-rebuild-loop scheme rests on this marker.
          # The changes job skips any push whose head commit message contains
          # [skip build]. If this stamp commit ever lost that marker, its own
          # push would re-trigger the pipeline for the same pyproject.toml /
          # uv.lock changes, produce another stamp commit, and loop forever.
          # Fail here, before pushing, instead of creating that loop.
          case "$msg" in
            *"[skip build]"*) ;;
            *)
              echo "FATAL: stamp-date commit message lost its [skip build] marker."
              echo "Message was:"
              echo "  $msg"
              echo ""
              echo "The changes job only skips pushes whose head commit message"
              echo "contains [skip build]. Pushing a stamp commit without it would"
              echo "re-trigger the full pipeline for content that was just built,"
              echo "stamp again, and enter an infinite rebuild loop."
              exit 1
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recompute the version date against whatever main is RIGHT NOW and
          # commit it. Called once before the first push and again on every
          # failed push, so each retry starts from a clean resync instead of
          # replaying a stale commit over a moved main.
          stamp_and_commit() {
            python_version_full=$(grep -oP '(?<=^FROM python:)[^@\s]+' Dockerfile)
            prefix="${python_version_full/-/+}"
            new_version="${prefix}.$(date -u +%Y%m%d%H%M)"
            sed -i "s/^version = \".*\"/version = \"${new_version}\"/" pyproject.toml
            uv lock
            git add pyproject.toml uv.lock
            git commit -m "$msg"
          }
          stamp_and_commit

          # Push with a bounded resync retry. The workflow-level concurrency
          # group (cancel-in-progress false for push) serializes workflow runs
          # on main, but it cannot serialize against a push that lands from
          # OUTSIDE this workflow while a run is mid-flight: another merge to
          # main (a Dependabot/enable-dep bump, or a second human PR merged in
          # the same window) can move main between this run's checkout and its
          # own git push. Both sides then independently edit the same
          # "version = ..." line with a DIFFERENT date, so a plain git rebase
          # would hit a three-way merge conflict on that line and die instead
          # of degrading. So on a failed push we reset hard to the freshest
          # main and recompute the whole stamp from scratch -- each attempt
          # starts clean rather than trying to reconcile two independent
          # calculations of one line.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "push attempt ${attempt} failed (main probably moved), resyncing and recomputing from fresh main"
            if ! git fetch origin main; then
              echo "FATAL: could not fetch origin/main during race retry."
              exit 1
            fi
            git reset --hard origin/main || {
              echo "FATAL: reset --hard onto updated main failed during race retry."
              exit 1
            }
            stamp_and_commit
          done
          if [ "$pushed" != "true" ]; then
            echo "FATAL: could not push stamp commit after 3 attempts."
            exit 1
          fi

      - name: Resolve final SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Watchdog for the other side of the [skip build] contract. "[skip build]"
  # is NOT a native GitHub Actions skip directive (only [skip ci], [ci skip],
  # [no ci], [skip actions] are) -- here it works solely because of the
  # if-condition on the changes job above. That means a human commit carrying
  # the marker while still touching pyproject.toml / uv.lock silently changes
  # image content with no build, smoke test, or Docker Hub publish behind it.
  # Surface that loudly instead of letting it slip through unnoticed.
  # Stamp commits themselves are exempt: they are authored by the bot and
  # legitimately skip the rebuild because the build job consumes their SHA in
  # this very workflow run (needs: stamp-date).
  skip-build-notice:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[skip build]') &&
      github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Warn if [skip build] suppressed an image-content change
        run: |
          # Diff the whole push range (before -> sha), not just HEAD^ HEAD:
          # a multi-commit push can change pyproject.toml/uv.lock in an
          # earlier commit while the head commit alone carries "[skip build]".
          # fetch-depth: 0 makes github.event.before available for the range.
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- pyproject.toml uv.lock; then
            echo "Commit is marked [skip build] and does not touch pyproject.toml or uv.lock."
            echo "No image content was skipped; nothing to do."
          else
            echo "::warning::This commit is marked [skip build] but modifies pyproject.toml and/or uv.lock."
            echo "::warning::Image content changed WITHOUT a build, smoke test, or Docker Hub publish."
            echo "::warning::If this was unintended, push a follow-up commit without the marker,"
            echo "::warning::or re-run the pipeline via workflow_dispatch with force_push=true."
            exit 0
          fi

  build:
    needs: [changes, stamp-date]
    # upload-sarif needs security-events: write on the push path (the real
    # stamp-date pipeline). PR runs use a separate API path that does not
    # require it, which is why the PR check went green without this - but the
    # first push to main after merge would fail with "Resource not accessible".
    permissions:
      contents: read
      security-events: write
    if: |
      always() &&
      needs.stamp-date.result != 'failure' &&
      needs.stamp-date.result != 'cancelled' &&
      (github.event_name != 'push' || needs.changes.outputs.image == 'true')
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.pyver.outputs.version }}
      full_version: ${{ steps.fullver.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve ref to build
        id: ref
        run: |
          if [ -n "${{ needs.stamp-date.outputs.sha }}" ]; then
            echo "sha=${{ needs.stamp-date.outputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Extract Python version
        id: pyver
        run: |
          version=$(grep -oP '(?<=^FROM python:)[0-9.]+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract full version from pyproject.toml
        id: fullver
        run: |
          version=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
          echo "tag=${version//+/-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Get UTC date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Get UTC timestamp for image CREATED label
        id: created
        # RFC 3339 with seconds precision; the date-only variant used
        # before stamped every image as built at exactly midnight UTC.
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          # Layer cache instead of full rebuild: PR builds (no stamp-date)
          # get a full hit; main pushes miss the uv sync layer by design
          # (date-stamped pyproject/uv.lock). APT_BUST refreshes only the
          # apt layer daily so system security patches keep flowing.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APT_BUST=${{ steps.date.outputs.date }}
            VERSION=${{ steps.fullver.outputs.tag }}
            REVISION=${{ steps.ref.outputs.sha }}
            CREATED=${{ steps.created.outputs.timestamp }}
          tags: |
            vyxan/jlpe_image:${{ steps.ref.outputs.sha }}
            vyxan/jlpe_image:${{ steps.fullver.outputs.tag }}
            vyxan/jlpe_image:${{ steps.pyver.outputs.version }}
            vyxan/jlpe_image:latest

      - name: Save image to tar
        run: docker save vyxan/jlpe_image:latest vyxan/jlpe_image:${{ steps.pyver.outputs.version }} vyxan/jlpe_image:${{ steps.fullver.outputs.tag }} vyxan/jlpe_image:${{ steps.ref.outputs.sha }} -o jlpe-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jlpe-image
          path: jlpe-image.tar
          retention-days: 1

      - name: Scan image for vulnerabilities
        # Report-only and non-blocking in both senses: severity filtering
        # decides what gets surfaced (no exit-code gate), AND continue-on-error
        # means an operational failure of the scan itself (e.g. vulnerability
        # DB download rate limit) cannot fail the build either, so the
        # unattended stamp-date pipeline stays zero-touch. Findings reach a
        # human via the SARIF upload below
        # (Security tab), covering the surface Dependabot alerts do not: the
        # OS layer (base image + apt packages) and the uv-synced Python
        # site-packages in one assembled-image scan.
        # Third-party action pinned to a full commit SHA per AGENTS.md.
        # v0.36.0 is the first post-supply-chain release (the Mar 2026 attack
        # force-pushed 76/77 historical tags); this SHA is the signed,
        # GitHub-verified commit for the v-prefix tag.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vyxan/jlpe_image:${{ steps.ref.outputs.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif

      - name: Upload scan results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          sarif_file: trivy-results.sarif

  smoke-test:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jlpe-image

      - name: Load image
        run: docker load -i jlpe-image.tar

      - name: Verify uv version
        run: |
          expected=$(grep -oP '(?<=^FROM ghcr\.io/astral-sh/uv:)[^@\s]+' Dockerfile)
          actual=$(docker run --rm --entrypoint uv vyxan/jlpe_image:latest --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "uv version mismatch: Dockerfile says $expected, image has $actual"
            exit 1
          fi
          echo "uv version: OK ($actual)"

      - name: Start container
        run: docker run -d --init --name test_container vyxan/jlpe_image:latest -c "sleep infinity"

      - name: Smoke test - data stack
        run: |
          docker exec -i test_container python - < tests/smoke/test_data_stack.py

      - name: Smoke test - tsfresh
        run: |
          docker exec -i test_container python - < tests/smoke/test_tsfresh.py

      - name: Smoke test - ML libraries (CPU real, GPU code-path only)
        run: |
          docker exec -i test_container python - < tests/smoke/test_ml_libraries.py

      - name: Smoke test - statsforecast
        run: |
          docker exec -i test_container python - < tests/smoke/test_statsforecast.py

      - name: Smoke test - mlflow
        run: |
          docker exec -i test_container python - < tests/smoke/test_mlflow.py

      - name: Smoke test - shap
        run: |
          docker exec -i test_container python - < tests/smoke/test_shap.py

      - name: Smoke test - prophet
        run: |
          docker exec -i test_container python - < tests/smoke/test_prophet.py

      - name: Smoke test - scipy, sklearn, statsmodels, optuna, sqlalchemy, dask
        run: |
          docker exec -i test_container python - < tests/smoke/test_stats_and_ml_stacks.py

      - name: Smoke test - visualization stack
        run: |
          docker exec -i test_container python - < tests/smoke/test_visualization.py
      - name: Smoke test - mlforecast
        run: |
          docker exec -i test_container python - < tests/smoke/test_mlforecast.py
      - name: Smoke test - ccxt
        run: |
          docker exec -i test_container python - < tests/smoke/test_ccxt.py
      - name: Smoke test - narwhals
        run: |
          docker exec -i test_container python - < tests/smoke/test_narwhals.py

      - name: Smoke test - JupyterLab starts and kernel is registered
        run: |
          # `docker exec -d` output is not captured by `docker logs`, so redirect
          # jupyter's own stdout/stderr into a file we can cat on failure.
          docker exec -d test_container bash -c "jupyter lab --allow-root --no-browser --ip=0.0.0.0 --port=8888 --IdentityProvider.token='' > /tmp/jupyter.log 2>&1"

          echo "Waiting for JupyterLab to respond..."
          for i in $(seq 1 20); do
            if docker exec test_container python -c "
          import urllib.request
          urllib.request.urlopen('http://localhost:8888/lab', timeout=2)
          " 2>/dev/null; then
              echo "JupyterLab is up after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "JupyterLab did not respond after 20 attempts"
              echo "--- docker logs ---"
              docker logs test_container
              echo "--- jupyter.log ---"
              docker exec test_container cat /tmp/jupyter.log
              exit 1
            fi
            sleep 1
          done

          echo "Checking kernel registration..."
          docker exec test_container jupyter kernelspec list | grep -qi python3 \
            || { echo "No python3 kernel registered"; exit 1; }
          echo "Kernel check: OK"
      - name: Smoke test - JupyterLab extensions resolve
        run: |
          # `jupyter labextension list` exits 0 even when an extension failed to
          # resolve, so also check the per-extension status column: each line is
          # "<name> v<version> enabled|disabled OK|X", where a bare `X` marks a
          # resolution failure.
          docker exec test_container jupyter labextension list | tee /tmp/labext.txt
          if grep -Eq '[[:space:]]X([[:space:]]|$)' /tmp/labext.txt; then
            echo "One or more lab extensions failed to resolve:"
            grep -E '[[:space:]]X([[:space:]]|$)' /tmp/labext.txt
            exit 1
          fi
          echo "All lab extensions resolved: OK"

  push:
    needs: [changes, smoke-test, build]
    if: |
      always() &&
      needs.smoke-test.result == 'success' &&
      (
        (github.event_name == 'push' &&
         needs.changes.result == 'success' &&
         needs.changes.outputs.image == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' &&
         inputs.force_push)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jlpe-image

      - name: Load image
        run: docker load -i jlpe-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push vyxan/jlpe_image:${{ needs.build.outputs.sha }}
          docker push vyxan/jlpe_image:${{ needs.build.outputs.full_version }}
          docker push vyxan/jlpe_image:${{ needs.build.outputs.python_version }}
          docker push vyxan/jlpe_image:latest
          