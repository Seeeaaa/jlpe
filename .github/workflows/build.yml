name: Build and smoke test (main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # if: github.event_name == 'push'
    # outputs:
    #   image: ${{ steps.filter.outputs.image }}
    # [skip build] marks a commit made by stamp-date itself: without this
    # check, that commit's own push would re-trigger the whole pipeline for
    # content that was already built and pushed in the run that made it.
    # The stamp-date job guards this marker before pushing (see the
    # "Commit and push" step there); skip-build-notice below watches the
    # reverse case (marker present on a human commit that changes image
    # content).
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip build]')
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Only these files define the actual image content.
            # Changes to .github/workflows/** must NOT trigger this.
            image:
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
  # This is the only job in the pipeline that pushes directly to main
  # instead of going through a PR. This is intentional: it lets version
  # stamping, build, smoke-test, and publish happen atomically in one
  # workflow run, without waiting on a separate PR to be merged.
  # Relies on the PAT_FOR_BOTS account being exempt from branch protection
  # (verify under Settings -> Branches if this job ever starts failing
  # with a permission error).
  stamp-date:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}

      - name: Compute new version date
        run: |
          python_version_full=$(grep -oP '(?<=^FROM python:)[^@\s]+' Dockerfile)
          prefix="${python_version_full/-/+}"
          new_version="${prefix}.$(date -u +%Y%m%d%H%M)"
          current_version=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
          if [ "$current_version" != "$new_version" ]; then
            sed -i "s/^version = \".*\"/version = \"${new_version}\"/" pyproject.toml
          fi

      - name: Extract uv version from Dockerfile
        id: uvver
        run: |
          version=$(grep -oP '(?<=^FROM ghcr\.io/astral-sh/uv:)[^@\s]+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uvver.outputs.version }}

      - name: Sync uv.lock
        # Required, not just tidiness: uv's --locked check treats any change
        # to `version` in pyproject.toml as making uv.lock stale, even though
        # `version` has no effect on dependency resolution (confirmed
        # empirically -- bumping only the version string and running
        # `uv sync --locked` fails with "lockfile needs to be updated").
        # Without this step, `RUN uv sync --locked ...` in the Dockerfile
        # would fail on every date-stamp bump, even with zero dependency
        # changes.
        run: uv lock

      - name: Check if anything actually changed
        id: diff
        run: |
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          msg="chore: sync uv.lock and bump image version date [skip build]"

          # Guard: the whole no-rebuild-loop scheme rests on this marker.
          # The changes job skips any push whose head commit message contains
          # [skip build]. If this stamp commit ever lost that marker, its own
          # push would re-trigger the pipeline for the same pyproject.toml /
          # uv.lock changes, produce another stamp commit, and loop forever.
          # Fail here, before pushing, instead of creating that loop.
          case "$msg" in
            *"[skip build]"*) ;;
            *)
              echo "FATAL: stamp-date commit message lost its [skip build] marker."
              echo "Message was:"
              echo "  $msg"
              echo ""
              echo "The changes job only skips pushes whose head commit message"
              echo "contains [skip build]. Pushing a stamp commit without it would"
              echo "re-trigger the full pipeline for content that was just built,"
              echo "stamp again, and enter an infinite rebuild loop."
              exit 1
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "$msg"

          # Push with a bounded rebase retry: two merges to main landing
          # within the same workflow window are normal here (the second one
          # triggers its own stamp-date run), and a failing push then kills
          # this run's whole build chain with non-fast-forward. Explicit
          # HEAD:main refspec so the push does not rely on the upstream
          # tracking configuration actions/checkout happens to create.
          # The rebase is safe for a bot-authored, single-purpose commit:
          # if main moved because another stamp landed, our version bump is
          # regenerated on top of it; if it moved for other reasons, worst
          # case the diff check below sees no changes and the run degrades
          # to build-only.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "push attempt ${attempt} failed (main probably moved), rebasing and retrying"
            git fetch origin main
            git rebase origin/main || {
              echo "FATAL: rebase onto updated main failed during race retry."
              exit 1
            }
          done
          if [ "$pushed" != "true" ]; then
            echo "FATAL: could not push stamp commit after 3 attempts."
            exit 1
          fi

      - name: Resolve final SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Watchdog for the other side of the [skip build] contract. "[skip build]"
  # is NOT a native GitHub Actions skip directive (only [skip ci], [ci skip],
  # [no ci], [skip actions] are) -- here it works solely because of the
  # if-condition on the changes job above. That means a human commit carrying
  # the marker while still touching pyproject.toml / uv.lock silently changes
  # image content with no build, smoke test, or Docker Hub publish behind it.
  # Surface that loudly instead of letting it slip through unnoticed.
  # Stamp commits themselves are exempt: they are authored by the bot and
  # legitimately skip the rebuild because the build job consumes their SHA in
  # this very workflow run (needs: stamp-date).
  skip-build-notice:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[skip build]') &&
      github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Warn if [skip build] suppressed an image-content change
        run: |
          if git diff --quiet HEAD^ HEAD -- pyproject.toml uv.lock; then
            echo "Commit is marked [skip build] and does not touch pyproject.toml or uv.lock."
            echo "No image content was skipped; nothing to do."
          else
            echo "::warning::This commit is marked [skip build] but modifies pyproject.toml and/or uv.lock."
            echo "::warning::Image content changed WITHOUT a build, smoke test, or Docker Hub publish."
            echo "::warning::If this was unintended, push a follow-up commit without the marker,"
            echo "::warning::or re-run the pipeline via workflow_dispatch with force_push=true."
            exit 0
          fi

  build:
    needs: [changes, stamp-date]
    if: |
      always() &&
      needs.stamp-date.result != 'failure' &&
      needs.stamp-date.result != 'cancelled' &&
      (github.event_name != 'push' || needs.changes.outputs.image == 'true')
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.pyver.outputs.version }}
      full_version: ${{ steps.fullver.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve ref to build
        id: ref
        run: |
          if [ -n "${{ needs.stamp-date.outputs.sha }}" ]; then
            echo "sha=${{ needs.stamp-date.outputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Extract Python version
        id: pyver
        run: |
          version=$(grep -oP '(?<=^FROM python:)[0-9.]+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract full version from pyproject.toml
        id: fullver
        run: |
          version=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml)
          echo "tag=${version//+/-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get UTC date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          # Layer cache instead of full rebuild: PR builds (no stamp-date)
          # get a full hit; main pushes miss the uv sync layer by design
          # (date-stamped pyproject/uv.lock). APT_BUST refreshes only the
          # apt layer daily so system security patches keep flowing.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APT_BUST=${{ steps.date.outputs.date }}
            VERSION=${{ steps.fullver.outputs.tag }}
            REVISION=${{ steps.ref.outputs.sha }}
            CREATED=${{ steps.date.outputs.date }}T00:00:00Z
          tags: |
            vyxan/jlpe_image:${{ steps.ref.outputs.sha }}
            vyxan/jlpe_image:${{ steps.fullver.outputs.tag }}
            vyxan/jlpe_image:${{ steps.pyver.outputs.version }}
            vyxan/jlpe_image:latest

      - name: Save image to tar
        run: docker save vyxan/jlpe_image:latest vyxan/jlpe_image:${{ steps.pyver.outputs.version }} vyxan/jlpe_image:${{ steps.fullver.outputs.tag }} vyxan/jlpe_image:${{ steps.ref.outputs.sha }} -o jlpe-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: jlpe-image
          path: jlpe-image.tar
          retention-days: 1

  smoke-test:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: jlpe-image

      - name: Load image
        run: docker load -i jlpe-image.tar

      - name: Verify uv version
        run: |
          expected=$(grep -oP '(?<=^FROM ghcr\.io/astral-sh/uv:)[^@\s]+' Dockerfile)
          actual=$(docker run --rm --entrypoint uv vyxan/jlpe_image:latest --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "uv version mismatch: Dockerfile says $expected, image has $actual"
            exit 1
          fi
          echo "uv version: OK ($actual)"

      - name: Start container
        # run: docker run -d --name test_container vyxan/jlpe_image:latest -c "sleep infinity"
        run: docker run -d --init --name test_container vyxan/jlpe_image:latest -c "sleep infinity"

      - name: Smoke test - data stack
        run: |
          docker exec -i test_container python - <<'EOF'
          import numpy as np
          import pandas as pd
          import polars as pl
          import pyarrow as pa
          import duckdb
          import geopandas as gpd
          import psycopg

          df = pd.DataFrame({"a": [1, 2, 3], "b": [4.0, 5.0, 6.0]})
          arrow_tbl = pa.Table.from_pandas(df)
          result = duckdb.sql("select sum(a) from arrow_tbl").fetchone()
          assert result[0] == 6, f"unexpected duckdb result: {result}"
          print("pandas -> pyarrow -> duckdb: OK")

          pl_df = pl.from_pandas(df)
          pl_arrow = pl_df.to_arrow()
          result_pl = duckdb.sql("select sum(a) from pl_arrow").fetchone()
          assert result_pl[0] == 6, f"unexpected polars/duckdb result: {result_pl}"
          print("pandas -> polars -> pyarrow -> duckdb: OK")

          gdf = gpd.GeoDataFrame({"geometry": gpd.points_from_xy([0, 1], [0, 1])})
          assert len(gdf) == 2
          print("geopandas: OK")

          print("psycopg import: OK")
          EOF

      - name: Smoke test - tsfresh
        run: |
          docker exec -i test_container python - <<'EOF'
          import pandas as pd
          from tsfresh import extract_features
          from tsfresh.feature_extraction import MinimalFCParameters

          df = pd.DataFrame({
              "id": [1] * 10,
              "time": range(10),
              "value": [1, 2, 3, 4, 5, 4, 3, 2, 1, 0],
          })
          features = extract_features(
              df, column_id="id", column_sort="time",
              default_fc_parameters=MinimalFCParameters(),
              disable_progressbar=True,
          )
          assert not features.empty
          print("tsfresh: OK")
          EOF

      - name: Smoke test - ML libraries (CPU real, GPU code-path only)
        run: |
          docker exec -i test_container python - <<'EOF'
          import os
          import numpy as np
          import xgboost as xgb
          import lightgbm as lgb
          import catboost as cb

          X = np.random.rand(100, 5)
          y = np.random.randint(0, 2, 100)

          xgb.XGBClassifier(device="cpu", n_estimators=5).fit(X, y)
          print("xgboost CPU: OK")

          info = xgb.build_info()
          assert info.get("USE_CUDA"), f"xgboost built without CUDA support: {info}"
          print("xgboost: CUDA build flag present")

          lgb.train(
              {"objective": "binary", "verbosity": -1, "device": "cpu"},
              lgb.Dataset(X, label=y),
              num_boost_round=5,
          )
          print("lightgbm CPU: OK")

          pkg_dir = os.path.dirname(cb.__file__)
          so_files = [f for f in os.listdir(pkg_dir) if f.endswith(".so")]
          assert so_files, f"no compiled extension found in {pkg_dir}"

          marker = b"cuda_lib/cuda_base"
          found = False
          for f in so_files:
              with open(os.path.join(pkg_dir, f), "rb") as fh:
                  if marker in fh.read():
                      found = True
                      break
          assert found, f"CUDA build marker not found in: {so_files}"
          print("catboost: CUDA build marker present")
          EOF

      - name: Smoke test - shap
        run: |
          docker exec -i test_container python - <<'EOF'
          import numpy as np
          from sklearn.ensemble import RandomForestRegressor
          import shap

          X = np.random.rand(50, 4)
          y = X[:, 0] * 2 + X[:, 1]
          model = RandomForestRegressor(n_estimators=10, random_state=0).fit(X, y)

          explainer = shap.Explainer(model)
          values = explainer(X[:5])

          assert values.values.shape == (5, 4), f"unexpected shap output shape: {values.values.shape}"
          print("shap: OK")
          EOF

      - name: Smoke test - prophet
        run: |
          docker exec -i test_container python - <<'EOF'
          import pandas as pd
          from prophet import Prophet

          df = pd.DataFrame({
              "ds": pd.date_range("2026-01-01", periods=30),
              "y": range(30),
          })
          model = Prophet()
          model.fit(df)
          forecast = model.predict(df.tail(5))
          assert len(forecast) == 5
          print("prophet: OK")
          EOF

      - name: Smoke test - scipy, sklearn, statsmodels, optuna, sqlalchemy, dask
        run: |
          docker exec -i test_container python - <<'EOF'
          import numpy as np
          import pandas as pd
          import scipy
          import scipy.linalg
          import sklearn
          from sklearn.linear_model import LinearRegression
          import statsmodels
          import statsmodels.api as sm
          import optuna
          from sqlalchemy import create_engine
          import dask.dataframe as dd

          # scipy: invert a small well-conditioned matrix -- this exercises the
          # BLAS/LAPACK bindings, which is where scipy installs most often break
          # (wrong wheel, missing shared libs), unlike a bare import
          a = np.array([[3.0, 1.0], [1.0, 2.0]])
          inv_a = scipy.linalg.inv(a)
          assert np.allclose(a @ inv_a, np.eye(2), atol=1e-8)
          print(f"scipy {scipy.__version__}: OK (linalg.inv)")

          # sklearn: fit a trivial linear model -- exercises the Cython-compiled
          # estimator code, not just the pure-Python package layer
          X = np.array([[1.0], [2.0], [3.0], [4.0]])
          y = np.array([2.0, 4.0, 6.0, 8.0])
          model = LinearRegression().fit(X, y)
          assert abs(model.coef_[0] - 2.0) < 1e-6
          print(f"sklearn {sklearn.__version__}: OK (LinearRegression fit)")

          # statsmodels: fit OLS on a trivial dataset and check the recovered slope
          X_sm = sm.add_constant(np.array([1.0, 2.0, 3.0, 4.0]))
          result = sm.OLS(y, X_sm).fit()
          assert abs(result.params[1] - 2.0) < 1e-6
          print(f"statsmodels {statsmodels.__version__}: OK (OLS fit)")

          # optuna: run a handful of trials on a trivial objective and check
          # it actually converges toward the known minimum, not just that
          # a Study object can be constructed
          optuna.logging.set_verbosity(optuna.logging.WARNING)

          def objective(trial):
            x = trial.suggest_float("x", -10, 10)
            return (x - 2) ** 2

          study = optuna.create_study()
          study.optimize(objective, n_trials=20)
          assert abs(study.best_params["x"] - 2) < 1.0
          print(f"optuna {optuna.__version__}: OK (best x={study.best_params['x']:.2f})")

          # dask[complete] pulls a large dependency tree that can silently
          # break against pinned pandas/numpy versions, so this executes
          # a real computation instead of just importing
          ddf = dd.from_pandas(pd.DataFrame({"a": [1, 2, 3]}), npartitions=1)
          assert ddf["a"].sum().compute() == 6
          print("dask: OK")

          # create_engine does not open a connection, it only validates
          # that the psycopg driver is registered and importable via sqlalchemy
          create_engine("postgresql+psycopg://")
          print("sqlalchemy + psycopg driver: OK")
          EOF

      - name: Smoke test - visualization stack
        run: |
          docker exec -i test_container python - <<'EOF'
          import io

          import colorcet as cc
          import matplotlib

          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import numpy as np
          import plotly
          import plotly.express as px
          import seaborn as sns

          # PNG file signature: 0x89 'P' 'N' 'G'
          PNG_SIG = bytes([0x89, 0x50, 0x4E, 0x47])

          # matplotlib: render a real figure to PNG bytes via the Agg backend --
          # catches broken freetype/pillow wiring that a bare import misses
          buf = io.BytesIO()
          fig, ax = plt.subplots()
          ax.plot([0, 1], [0, 1])
          fig.savefig(buf, format="png")
          png = buf.getvalue()
          assert png.startswith(PNG_SIG), f"not a PNG: {png[:8]!r}"
          print(f"matplotlib {matplotlib.__version__}: OK (rendered PNG, {len(png)} bytes)")

          # seaborn: build a heatmap from real data and render it -- exercises
          # the full seaborn -> matplotlib integration path, not just the import
          data = np.arange(100).reshape(10, 10)
          fig, ax = plt.subplots()
          sns.heatmap(data, ax=ax)
          buf = io.BytesIO()
          fig.savefig(buf, format="png")
          assert buf.getvalue().startswith(PNG_SIG)
          print("seaborn: OK (heatmap rendered)")

          # plotly: build a figure and serialize it to standalone HTML --
          # validates the JS-bundle embedding path used when figures land
          # in notebooks
          pfig = px.scatter(x=[1, 2, 3], y=[3, 1, 2])
          html = pfig.to_html(full_html=True, include_plotlyjs=False)
          assert "<div" in html and "</div>" in html, "plotly produced unexpected HTML"
          print(f"plotly {plotly.__version__}: OK (to_html)")

          # colorcet: use cc.cm.fire as a cmap in an actual imshow render --
          # verifies registered colormaps work through matplotlib's colormap
          # machinery, not just that they exist
          fig, ax = plt.subplots()
          ax.imshow(np.arange(256).reshape(16, 16), cmap=cc.cm.fire)
          buf = io.BytesIO()
          fig.savefig(buf, format="png")
          assert buf.getvalue().startswith(PNG_SIG)
          print("colorcet: OK (cc.cm.fire as cmap)")
          EOF

      - name: Smoke test - JupyterLab starts and kernel is registered
        run: |
          # `docker exec -d` output is not captured by `docker logs`, so redirect
          # jupyter's own stdout/stderr into a file we can cat on failure.
          docker exec -d test_container bash -c "jupyter lab --allow-root --no-browser --ip=0.0.0.0 --port=8888 --IdentityProvider.token='' > /tmp/jupyter.log 2>&1"

          echo "Waiting for JupyterLab to respond..."
          for i in $(seq 1 20); do
            if docker exec test_container python -c "
          import urllib.request
          urllib.request.urlopen('http://localhost:8888/lab', timeout=2)
          " 2>/dev/null; then
              echo "JupyterLab is up after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "JupyterLab did not respond after 20 attempts"
              echo "--- docker logs ---"
              docker logs test_container
              echo "--- jupyter.log ---"
              docker exec test_container cat /tmp/jupyter.log
              exit 1
            fi
            sleep 1
          done

          echo "Checking kernel registration..."
          docker exec test_container jupyter kernelspec list | grep -qi python3 \
            || { echo "No python3 kernel registered"; exit 1; }
          echo "Kernel check: OK"
      - name: Smoke test - JupyterLab extensions resolve
        run: |
          # `jupyter labextension list` exits 0 even when an extension failed to
          # resolve, so also check the per-extension status column: each line is
          # "<name> v<version> enabled|disabled OK|X", where a bare `X` marks a
          # resolution failure.
          docker exec test_container jupyter labextension list | tee /tmp/labext.txt
          if grep -Eq '[[:space:]]X([[:space:]]|$)' /tmp/labext.txt; then
            echo "One or more lab extensions failed to resolve:"
            grep -E '[[:space:]]X([[:space:]]|$)' /tmp/labext.txt
            exit 1
          fi
          echo "All lab extensions resolved: OK"

  push:
    needs: [changes, smoke-test, build]
    if: |
      always() &&
      needs.smoke-test.result == 'success' &&
      (
        (github.event_name == 'push' &&
         needs.changes.result == 'success' &&
         needs.changes.outputs.image == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' &&
         github.event.inputs.force_push == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: jlpe-image

      - name: Load image
        run: docker load -i jlpe-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push vyxan/jlpe_image:${{ needs.build.outputs.sha }}
          docker push vyxan/jlpe_image:${{ needs.build.outputs.full_version }}
          docker push vyxan/jlpe_image:${{ needs.build.outputs.python_version }}
          docker push vyxan/jlpe_image:latest
          