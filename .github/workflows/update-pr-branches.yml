name: Update PR branches

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/update-pr-branches.yml"

jobs:
  update-branches:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Update open PR branches to latest main
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PAT_FOR_BOTS }}
          script: |
            const isTestRun = context.eventName === "pull_request";
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "main",
            });
            for (const pr of prs.data) {
              if (isTestRun) {
                console.log(`[test run] would update PR #${pr.number}`);
                continue;
              }
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                console.log(`Updated PR #${pr.number}`);
              } catch (e) {
                console.log(`Skipped PR #${pr.number}: ${e.message}`);
              }
            }