name: Update PR branches
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/update-pr-branches.yml"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read

jobs:
  update-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Bot PAT available
        id: pat
        run: |
          if [ -n "${{ secrets.PAT_FOR_BOTS }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PAT_FOR_BOTS not provided for this event type -- merge will fail"
          fi

      - name: Update open PR branches to latest main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.PAT_FOR_BOTS || secrets.GITHUB_TOKEN }}
          script: |
            const isTestRun = context.eventName === "pull_request";
            // pulls.list returns only the first page (30 PRs by default), so
            // more than 30 open PRs targeting main would silently skip the
            // rest. github.paginate walks every page and returns the merged
            // array directly (no .data wrapper).
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "main",
            });
            // Branches owned by create-pull-request (intermediate-deps,
            // bump-base, enable-dep probes, python-minor crossings) are
            // rebuilt from a fresh origin/main on every run of their parent
            // workflow: create-pull-request resets the branch to current
            // main and force-pushes the regenerated content, so merging main
            // into them adds nothing and only opens a race window. Both
            // workflows trigger on the same push to main - while the parent
            // job holds a fetched ref of the branch (preparing its
            // force-with-lease push), this merge moves the remote ref and
            // the push dies with "cannot lock ref ... is at X but expected
            // Y" (seen 2026-10-06: intermediate-deps vs this workflow on
            // upgrade-intermediate-deps, both fired by the #265 merge).
            // Skip them; dependabot branches keep receiving the merge.
            const CPR_BRANCH_RE =
              /^(upgrade-intermediate-deps|bump-(python|uv)-version|enable-dep-[^/]+|migrate-python-[^/]+)$/;
            for (const pr of prs) {
              if (CPR_BRANCH_RE.test(pr.head.ref)) {
                console.log(`Skipped PR #${pr.number}: branch '${pr.head.ref}' is owned by create-pull-request and rebuilt from main on every run`);
                continue;
              }
              if (isTestRun) {
                console.log(`[test run] would update PR #${pr.number}`);
                continue;
              }
              try {
                await github.rest.repos.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: pr.head.ref,
                  head: "main",
                  // The magic string keeps Dependabot able to rebase/force-push this
                  // branch itself later -- without it, this merge commit would count
                  // as a foreign edit and Dependabot would give up on the PR.
                  commit_message: "chore: merge main into PR branch [dependabot skip]",
                });
                console.log(`Updated PR #${pr.number}`);
              } catch (e) {
                console.log(`Skipped PR #${pr.number}: ${e.message}`);
              }
            }