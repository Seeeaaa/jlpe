name: Update uv.lock
concurrency:
  group: update-lock-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches-ignore:
      - main
    paths:
      # Both files affect what `uv lock` resolves to: pyproject.toml changes
      # the constraints, Dockerfile changes the uv itself (a new uv version
      # can produce a different lock, or fail outright).
      - "pyproject.toml"
      - "Dockerfile"
  pull_request:
    paths:
      - ".github/workflows/update-lock.yml"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a real push, PAT is required instead of the default GITHUB_TOKEN
          # so that the resulting push is treated as a "real" push and
          # re-triggers build.yml (pull_request/synchronize) on this branch.
          # On a pull_request run (this workflow file itself changed, e.g. a
          # Dependabot action-version bump), the commit step below is skipped
          # via `if:`, so this is read-only verification only -- the default
          # GITHUB_TOKEN is enough and doesn't depend on PAT_FOR_BOTS being
          # available under Dependabot secrets for this event type specifically.
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.PAT_FOR_BOTS }}

      - name: Extract uv version from Dockerfile
        id: uvver
        run: |
          version=$(grep -oP '(?<=^FROM ghcr\.io/astral-sh/uv:)\S+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ steps.uvver.outputs.version }}

      - name: Regenerate uv.lock
        run: uv lock

      - name: Commit uv.lock if changed
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate uv.lock"
          file_pattern: uv.lock
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"