name: Update uv.lock
concurrency:
  group: update-lock-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches-ignore:
      - main
    # No paths filter here on purpose: this is a required status check, so it
    # has to report on every push regardless of which files changed --
    # otherwise PRs get stuck on "Expected -- waiting for status to be
    # reported" for branches whose push doesn't match the filter.
  pull_request:
    paths:
      - ".github/workflows/update-lock.yml"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a real push, PAT is required instead of the default GITHUB_TOKEN
          # so that the resulting push is treated as a "real" push and
          # re-triggers build.yml (pull_request/synchronize) on this branch.
          # On a pull_request run (this workflow file itself changed, e.g. a
          # Dependabot action-version bump), the commit step below is skipped
          # via `if:`, so this is read-only verification only -- the default
          # GITHUB_TOKEN is enough.
          #
          # Dependabot branch pushes (dependabot[bot] as head commit author)
          # receive NO custom repository secrets at all: GitHub passes an
          # empty string for PAT_FOR_BOTS there, and checkout used to die
          # with "could not read Username". Fall back to GITHUB_TOKEN in
          # that case; the "Bot PAT available" step detects it and the
          # commit step degrades to verification-only (see its `if:`).
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.PAT_FOR_BOTS || secrets.GITHUB_TOKEN }}

      - name: Bot PAT available
        id: pat
        run: |
          # secrets.* cannot be read inside `if:` expressions portably, so
          # materialize availability as a step output once.
          if [ -n "${{ secrets.PAT_FOR_BOTS }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PAT_FOR_BOTS not provided for this event type (expected on dependabot[bot] pushes) -- running verification-only, no auto-commit"
          fi

      - name: Extract uv version from Dockerfile
        id: uvver
        run: |
          version=$(grep -oP '(?<=^FROM ghcr\.io/astral-sh/uv:)[^@\s]+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uvver.outputs.version }}

      - name: Regenerate uv.lock
        run: uv lock

      # Auto-commit requires the PAT: with GITHUB_TOKEN the push would not
      # re-trigger build.yml (pull_request/synchronize) on this branch and
      # would also interfere with Dependabot's branch management. When the
      # PAT is absent (dependabot[bot] pushes), report the status green so
      # the required check never blocks those PRs; any real lock drift on
      # main is picked up by the nightly check-upstream intermediate-deps
      # job instead.
      - name: Commit uv.lock if changed
        if: github.event_name != 'pull_request' && steps.pat.outputs.available == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: regenerate uv.lock"
          file_pattern: uv.lock
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
