name: Update uv.lock
concurrency:
  group: update-lock-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches-ignore:
      - main
    # No paths filter here on purpose: this is a required status check, so it
    # has to report on every push regardless of which files changed --
    # otherwise PRs get stuck on "Expected -- waiting for status to be
    # reported" for branches whose push doesn't match the filter.
  pull_request:
    paths:
      - ".github/workflows/update-lock.yml"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    # Dependabot branch pushes are treated as fork PRs: they receive a
    # read-only GITHUB_TOKEN and NO repository secrets (PAT_FOR_BOTS is
    # empty). This job cannot regenerate and re-commit uv.lock via the PAT in
    # that situation, and it must not fail (it is a required status check).
    # Skip it for dependabot so the check reports neutral instead of dying at
    # checkout with "could not read Username"; any lock drift is caught by the
    # nightly check-upstream intermediate-deps job against main.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.PAT_FOR_BOTS || secrets.GITHUB_TOKEN }}

      - name: Bot PAT available
        id: pat
        run: |
          # secrets.* cannot be read inside `if:` expressions portably, so
          # materialize availability as a step output once.
          if [ -n "${{ secrets.PAT_FOR_BOTS }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PAT_FOR_BOTS not provided -- running verification-only, no auto-commit"
          fi

      - name: Read uv version from Dockerfile
        id: uvver
        uses: ./.github/actions/read-uv-version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ steps.uvver.outputs.version }}

      - name: Regenerate uv.lock
        run: uv lock

      # Auto-commit requires the PAT: with GITHUB_TOKEN the push would not
      # re-trigger build.yml (pull_request/synchronize) on this branch and
      # would also interfere with Dependabot's branch management. When the
      # PAT is absent (dependabot[bot] pushes), report the status green so
      # the required check never blocks those PRs; any real lock drift on
      # main is picked up by the nightly check-upstream intermediate-deps
      # job instead.
      - name: Commit uv.lock if changed
        if: github.event_name != 'pull_request' && steps.pat.outputs.available == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: regenerate uv.lock"
          file_pattern: uv.lock
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
