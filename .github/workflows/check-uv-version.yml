name: Check uv version

on:
  schedule:
    - cron: "0 6 * * *"  # every day, 06:00 UTC
  workflow_dispatch:

jobs:
  check-uv-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get current uv version from Dockerfile
        id: current
        run: |
          version=$(grep -oP '(?<=ARG UV_VERSION=)\S+' Dockerfile)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get latest uv release
        id: latest
        run: |
          latest=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/astral-sh/uv/releases/latest \
            | jq -r .tag_name | sed 's/^v//')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Dockerfile
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          sed -i "s/ARG UV_VERSION=.*/ARG UV_VERSION=${{ steps.latest.outputs.version }}/" Dockerfile

      - name: Create pull request
        if: steps.compare.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_FOR_BOTS }}
          commit-message: "build(deps): bump uv from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          title: "build(deps): bump uv from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          body: |
            Bumps uv from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}` in the Dockerfile.

            Release notes: https://github.com/astral-sh/uv/releases/tag/${{ steps.latest.outputs.version }}
          branch: bump-uv-version
          labels: dependencies,docker
          delete-branch: true