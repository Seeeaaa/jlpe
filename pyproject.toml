[project]
name = "jlpe"
version = "3.13.14+slim-trixie.20260715"
description = "Portable JupyterLab environment that simplifies setup and ensures consistency across different platforms."
authors = [{ name = "Seeeaaa" }]
readme = "README.md"
requires-python = ">=3.13"

[tool.uv]
package = false

[dependency-groups]
ml = [
    "xgboost==3.3.0",
    "lightgbm==4.6.0",
    "catboost==1.2.10",
    "prophet==1.3.0",
    "optuna==4.9.0",
    # "shap==0.52.0",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
    "tsfresh[dask]==0.21.2",
    # "mlflow==3.14.0",
]

data = [
    "pandas[performance]==3.0.3",
    "numpy==2.4.6",
    "scipy==1.18.0",
    "polars==1.42.1",
    "dask[complete]==2026.7.0",
    "duckdb==1.5.4",
    "pyarrow==25.0.0",
    "SQLAlchemy==2.0.51",
    "psycopg[binary,pool]==3.3.4",
]

visualization = [
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    "plotly==6.9.0",
    "colorcet==3.2.1",
    "bokeh==3.9.1",
    "geopandas==1.1.4",
    "kaleido==1.3.0",
]

jupyterlab = [
    "jupyterlab==4.6.1",
    "jupyterlab-execute-time==3.3.0",
    "jupyter-resource-usage==1.2.1",
    "ipywidgets==8.1.8",
    "nb-clean==4.0.1",
    "jupyter-ruff==0.3.1",
    "tqdm==4.68.3",
]

theme = [
    "catppuccin-jupyterlab==0.2.5",
]