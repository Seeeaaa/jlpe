[project]
name = "jlpe"
# The image version lives in the VERSION file at the repo root, not here:
# a static placeholder is required below because a [project] table without
# a version field fails to parse (uv lock refuses it), but uv embeds any
# version value into uv.lock's root jlpe entry. A dynamic (date-stamped)
# version here changed uv.lock bytes on every stamp, which invalidated the
# COPY layer and forced the (heavy) uv sync layer to rebuild daily. The
# static placeholder keeps uv.lock byte-stable across stamps; the real
# version is COPYed into the image from VERSION after the sync layer and
# stamped by build.yml, which reads that file.
version = "0.0.0"
description = "Portable JupyterLab environment that simplifies setup and ensures consistency across different platforms."
authors = [{ name = "Seeeaaa" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"

# Pinned top-level versions live here; exact resolved versions
# (including transitive dependencies) are tracked in uv.lock,
# generated in CI - do not edit uv.lock by hand.
[tool.uv]
package = false
# Project only ever runs inside the Linux-based Docker image,
# so there is no need to resolve dependencies for Windows.
environments = [
    "sys_platform == 'linux'",
]

[dependency-groups]
ml = [
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "prophet==1.4.0",
    "optuna==5.0.0",
    "shap==0.52.0",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "tsfresh[dask]==0.21.2",
    "mlflow==3.16.1",
]

data = [
    "pandas[performance]==3.0.6",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "polars==1.44.2",
    "dask==2026.8.0",
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
    "sqlalchemy==2.0.54",
    "psycopg[binary,pool]==3.3.6",
    "narwhals==2.26.0",
    "ccxt==4.5.84",
]

visualization = [
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "plotly==7.1.0",
    "colorcet==3.2.1",
    "geopandas==1.1.4",
]

jupyterlab = [
    "jupyterlab==4.6.4",
    "ipykernel==7.3.0",
    "jupyterlab-execute-time==3.3.0",
    "jupyter-resource-usage==1.3.0",
    "ipywidgets==8.1.9",
    "nb-clean==4.0.1",
    "jupyter-ruff==0.3.1",
    "tqdm==4.70.1",
]

theme = [
    "catppuccin-jupyterlab==0.2.5",
]
