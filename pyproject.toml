[project]
name = "jlpe"
version = "3.13.15+slim-trixie.202608241714"
description = "Portable JupyterLab environment that simplifies setup and ensures consistency across different platforms."
authors = [{ name = "Seeeaaa" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"

# Pinned top-level versions live here; exact resolved versions
# (including transitive dependencies) are tracked in uv.lock,
# generated in CI - do not edit uv.lock by hand.
# Note: changing `version` below also requires re-running `uv lock`,
# even though it doesn't touch dependencies (CI does this automatically).
[tool.uv]
package = false
# Project only ever runs inside the Linux-based Docker image,
# so there is no need to resolve dependencies for Windows.
environments = [
    "sys_platform == 'linux'",
]

[dependency-groups]
ml = [
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "prophet==1.4.0",
    "optuna==4.9.0",
    "shap==0.52.0",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
    "tsfresh[dask]==0.21.2",
]

data = [
    "pandas[performance]==3.0.5",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "polars==1.44.0",
    "dask==2026.7.1",
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
    "sqlalchemy==2.0.52",
    "psycopg[binary,pool]==3.3.4",
]

visualization = [
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "plotly==6.9.0",
    "colorcet==3.2.1",
    "geopandas==1.1.4",
]

jupyterlab = [
    "jupyterlab==4.6.3",
    "jupyterlab-execute-time==3.3.0",
    "jupyter-resource-usage==1.3.0",
    "ipywidgets==8.1.9",
    "nb-clean==4.0.1",
    "jupyter-ruff==0.3.1",
    "tqdm==4.70.0",
]

theme = [
    "catppuccin-jupyterlab==0.2.5",
]
